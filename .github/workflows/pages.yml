name: Publish dashboard
# Publishes to https://ustdashboard.vercel.app and to GitHub Pages.

# One update every US Treasury market trading day (weekends and SIFMA bond-market holidays are skipped by
# trading_day.py), at about 8:50am New York time: after the 8:30am economic releases (CPI, payrolls, retail sales,
# claims), with the previous day's closing curve, fresh futures, overnight funding (SOFR, EFFR) and news.
# GitHub cron runs in UTC, ignores daylight saving and can start late, so the job is scheduled three times each
# weekday morning and schedule_gate.py publishes on the first run after 8:30am New York time that finds today's update
# not yet published. The later runs then do nothing.
on:
  schedule:
    - cron: "50 12 * * 1-5"   # 8:50 EDT / 7:50 EST
    - cron: "50 13 * * 1-5"   # 9:50 EDT / 8:50 EST
    - cron: "30 15 * * 1-5"   # 11:30 EDT / 10:30 EST, backup if the earlier runs were delayed or failed
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Trading day and New York time
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then run=true; else run=$(python3 schedule_gate.py); fi
          echo "Publish: $run (${{ github.event_name }}, New York $(TZ=America/New_York date '+%a %H:%M'))"
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - name: Build the static site
        if: steps.gate.outputs.run == 'true'
        run: python3 build_static.py
      - uses: actions/upload-pages-artifact@v3
        if: steps.gate.outputs.run == 'true'
        with:
          path: site
      # Production site: https://ustdashboard.vercel.app (needs the VERCEL_TOKEN repository secret).
      - name: Deploy to Vercel
        if: steps.gate.outputs.run == 'true' && env.VERCEL_TOKEN != ''
        working-directory: site
        run: npx --yes vercel@64.3.1 deploy --prod --yes --token "$VERCEL_TOKEN"

  deploy:
    needs: build
    if: needs.build.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
